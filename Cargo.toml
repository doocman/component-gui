[package]
name = "aspect-gui"
version = "0.1.0"
edition = "2021"

[lib]
name = "aspect_gui"
path = "rust-src/asp.rs"

[[example]]
name = "aspect-gui-hello-world"
path = "examples/rust/hello-world.rs"

[dependencies.sdl2]
version = ">= 0.36.0"
optional = true
features = ["ttf"]

[dev-dependencies]
sdl2 = { features = ["bundled", "static-link"], version = ">= 0.36.0"}
sdl2-sys = {features = ["ttf", "static-link"], version = ">= 0.36.0"}

[features]
default = [ "sdl-backend" ]
sdl-backend = ["sdl2"]

